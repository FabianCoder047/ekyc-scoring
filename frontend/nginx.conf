server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 6m;

    # En-têtes de sécurité. La CSP autorise les styles inline requis par
    # Angular Material et les polices Google ; les scripts restent locaux.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # L'API conserve son préfixe /api (context-path Spring Boot).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Application monopage Angular : toute route inconnue renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des ressources fingerprintées. On n'ajoute pas d'en-tête ici afin
    # de conserver l'héritage des en-têtes de sécurité du bloc server.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        expires 7d;
    }
}
